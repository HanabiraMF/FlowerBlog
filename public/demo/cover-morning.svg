      <ellipse cx="0" cy="-118" rx="84" ry="128" transform="rotate(72)"/>
      <ellipse cx="0" cy="-118" rx="84" ry="128" transform="rotate(144)"/>
      <ellipse cx="0" cy="-118" rx="84" ry="128" transform="rotate(216)"/>
