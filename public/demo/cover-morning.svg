    </g>
    <circle cx="0" cy="0" r="54" fill="#e3bd78"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#f6ead2" stroke-width="1.4" opacity="0.7"/>
    <g fill="#7b4c36" opacity="0.5">
      <circle cx="-16" cy="-12" r="3.4"/>
      <circle cx="16" cy="-3" r="2.6"/>
