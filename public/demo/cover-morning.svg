<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e7d5"/>
      <stop offset="0.55" stop-color="#ece1cd"/>
      <stop offset="1" stop-color="#e3d4ba"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9a47f"/>
      <stop offset="0.7" stop-color="#d88b6a"/>
      <stop offset="1" stop-color="#c9785b"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6a184"/>
      <stop offset="1" stop-color="#c56f54"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="892" cy="252" r="250" fill="url(#sun)" opacity="0.95"/>
